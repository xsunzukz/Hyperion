version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Routine version PRs are paused after the initial dependency sweep.
    # Security updates still run independently.
    open-pull-requests-limit: 0
    ignore:
      # These majors need a dedicated migration and UI regression pass.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: lucide-react
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # 0.x minor bumps are breaking API changes for these crates.
      - dependency-name: rusqlite
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: windows
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: base64
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: sha2
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: rfd
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: dirs
        update-types: ["version-update:semver-major"]
      - dependency-name: sha1
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: aes-gcm
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
