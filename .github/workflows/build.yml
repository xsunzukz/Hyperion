name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version v$version"
          }

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows bundles
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
              throw "TAURI_SIGNING_PRIVATE_KEY is not configured for this repository."
            }
            npm run tauri build -- --config src-tauri/tauri.updater.conf.json
          } else {
            npm run tauri build
          }

      - name: Prepare portable build and checksums
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $target = "src-tauri/target/release"

          $standalone = Join-Path $target "Hyperion_${version}_standalone.exe"
          Copy-Item -LiteralPath (Join-Path $target "hyperion.exe") -Destination $standalone -Force

          $setup = Get-ChildItem (Join-Path $target "bundle/nsis") `
            -Filter "Hyperion_${version}_x64-setup.exe" |
            Select-Object -First 1
          $msi = Get-ChildItem (Join-Path $target "bundle/msi") `
            -Filter "Hyperion_${version}_*.msi" |
            Select-Object -First 1

          if (-not $setup -or -not $msi) {
            throw "Expected NSIS and MSI bundles were not produced."
          }

          $lines = foreach ($file in @($standalone, $setup.FullName, $msi.FullName)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $target "SHA256SUMS.txt") -Encoding ascii
          $lines

      - name: Prepare updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $target = "src-tauri/target/release"
          $setup = Get-ChildItem (Join-Path $target "bundle/nsis") `
            -Filter "Hyperion_${version}_x64-setup.exe" |
            Select-Object -First 1
          if (-not $setup) {
            throw "The NSIS updater installer was not produced."
          }

          $signaturePath = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "Missing updater signature: $signaturePath"
          }
          $signature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          if (-not $signature) {
            throw "The updater signature is empty."
          }

          $download = "https://github.com/xsunzukz/Hyperion/releases/download/v$version/$([uri]::EscapeDataString($setup.Name))"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = [ordered]@{
            version = $version
            notes = "Hyperion $version is available. See the release page for the full changelog."
            pub_date = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $download
              }
            }
          }

          $json = $manifest | ConvertTo-Json -Depth 6
          $latestPath = Join-Path $target "latest.json"
          [System.IO.File]::WriteAllText(
            $latestPath,
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )
          Get-Content -LiteralPath $latestPath

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hyperion-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/Hyperion_*_standalone.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/SHA256SUMS.txt
            src-tauri/target/release/latest.json

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hyperion-windows-x64
          path: release-assets

      - name: Attach assets to GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Hyperion ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release-assets/Hyperion_*_standalone.exe
            release-assets/bundle/nsis/*.exe
            release-assets/bundle/nsis/*.sig
            release-assets/bundle/msi/*.msi
            release-assets/SHA256SUMS.txt
            release-assets/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
