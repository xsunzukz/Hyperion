name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version v$version"
          }

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows bundles
        run: npm run tauri build

      - name: Prepare portable build and checksums
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $target = "src-tauri/target/release"

          $standalone = Join-Path $target "Hyperion_${version}_standalone.exe"
          Copy-Item -LiteralPath (Join-Path $target "hyperion.exe") -Destination $standalone -Force

          $setup = Get-ChildItem (Join-Path $target "bundle/nsis") -Filter "*.exe" |
            Select-Object -First 1
          $msi = Get-ChildItem (Join-Path $target "bundle/msi") -Filter "*.msi" |
            Select-Object -First 1

          if (-not $setup -or -not $msi) {
            throw "Expected NSIS and MSI bundles were not produced."
          }

          $lines = foreach ($file in @($standalone, $setup.FullName, $msi.FullName)) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $lines | Set-Content -LiteralPath (Join-Path $target "SHA256SUMS.txt") -Encoding ascii
          $lines

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/Hyperion_*_standalone.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/SHA256SUMS.txt

      - name: Attach assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hyperion ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/Hyperion_*_standalone.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
